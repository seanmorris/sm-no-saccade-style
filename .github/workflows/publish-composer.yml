name: Publish Composer package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate-release-tag:
    name: Validate release tag
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate release tag
        run: |
          version="$(node -p "require('./packages/js/package.json').version")"
          sh scripts/validate-release-tag.sh "${GITHUB_REF_NAME}" "${version}"

  verify:
    name: Build and test
    needs: validate-release-tag
    uses: ./.github/workflows/verify.yml

  publish:
    name: Publish Composer package
    needs: verify
    runs-on: ubuntu-latest
    env:
      COMPOSER_PACKAGE_REPOSITORY: ${{ secrets.COMPOSER_PACKAGE_REPOSITORY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish split package
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${COMPOSER_PACKAGE_REPOSITORY}" ]]; then
            echo "::error::COMPOSER_PACKAGE_REPOSITORY secret is not configured."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="split/php-${GITHUB_REF_NAME}"

          git branch -D "${branch}" >/dev/null 2>&1 || true
          git subtree split --prefix=packages/php -b "${branch}"

          git tag -d "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
          git tag "${GITHUB_REF_NAME}" "${branch}"

          git push "${COMPOSER_PACKAGE_REPOSITORY}" "${branch}:refs/heads/main"
          git push "${COMPOSER_PACKAGE_REPOSITORY}" "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
